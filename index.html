<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data IT KSU</title>
<script>try{var t=localStorage.getItem('ksu_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#17202e;--mut:#667385;--bd:#dce2ea;--hd:#f3f5f9;--pri:#0f766e;--pri-t:#fff;--warn-bg:#fff6dd;--warn-bd:#efd88a;--warn-tx:#6b4e00;--bad:#c2362b;--ok:#15803d;--sec:#17324d;--sec-t:#fff;--sh:0 1px 2px rgba(15,30,50,.06),0 8px 24px rgba(15,30,50,.06);color-scheme:light}
:root[data-theme=dark]{--bg:#0d141d;--card:#151f2c;--tx:#e6ecf4;--mut:#8b98aa;--bd:#263446;--hd:#1b2838;--pri:#2dd4bf;--pri-t:#06201c;--warn-bg:#2a2410;--warn-bd:#5c4d17;--warn-tx:#f2d675;--bad:#ff8479;--ok:#4ade80;--sec:#1d3a57;--sh:none;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0d141d;--card:#151f2c;--tx:#e6ecf4;--mut:#8b98aa;--bd:#263446;--hd:#1b2838;--pri:#2dd4bf;--pri-t:#06201c;--warn-bg:#2a2410;--warn-bd:#5c4d17;--warn-tx:#f2d675;--bad:#ff8479;--ok:#4ade80;--sec:#1d3a57;--sh:none;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans',system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace}.hide{display:none!important}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--hd);font-size:.86rem;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-t);font-weight:600}
.btn.bad{color:var(--bad)}.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}.btn:disabled{opacity:.5}
.logo{width:40px;height:40px;flex:none;border-radius:11px;background:var(--sec);color:#fff;display:grid;place-items:center;font-size:1.15rem}

/* LOGIN */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
#login .thm{position:absolute;top:14px;right:14px}
.lbox{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:30px 24px 24px;box-shadow:var(--sh);text-align:center}
.lbox .logo{width:54px;height:54px;margin:0 auto 14px;font-size:1.5rem;border-radius:15px}
.lbox h1{margin:0;font-size:1.35rem;font-weight:600;overflow-wrap:anywhere}
.lbox .bs{margin:4px 0 0;color:var(--mut);font-size:.88rem}
#lsub{margin:18px 0 14px;font-size:.92rem}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.dot{height:50px;max-width:44px;flex:1 1 0;min-width:0;border:1.5px solid var(--bd);border-radius:12px;background:var(--hd);display:grid;place-items:center}
.dot.cur{border-color:var(--pri)}.dot.fill{border-color:var(--pri);background:var(--card)}
.dot.fill::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--tx)}
.dots.err{animation:shake .4s}.dots.err .dot{border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.dots.err{animation:none}}
#lmsg{min-height:20px;margin:0 0 12px;font-size:.85rem;color:var(--bad)}#lmsg.info{color:var(--mut)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:54px;border-radius:14px;background:var(--hd);border:1px solid var(--bd);font-size:1.25rem;font-weight:500}
.pad button:active{background:var(--bd)}.pad .fn{font-size:.85rem;color:var(--mut)}.pad button:disabled{opacity:.45}

/* APP: laptop = sidebar kiri, HP = bilah atas */
#app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:12px;align-items:flex-start}
.brand .bt{min-width:0;flex:1}.brand b{display:block;font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.brand small{color:var(--mut);font-size:.8rem;display:block}
.brand .ed{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--hd);flex:none;font-size:.8rem}
.lbl{display:block}.cap{font-size:.74rem;color:var(--mut);font-weight:600;margin:0 0 6px 4px}
#sheets{display:flex;flex-direction:column;gap:4px}
.sh1{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;text-align:left;font-size:.9rem;border:1px solid transparent}
.sh1:hover{background:var(--hd)}.sh1.on{background:var(--pri);color:var(--pri-t);font-weight:600}
.sh1 em{font-style:normal;font-size:.75rem;opacity:.75;white-space:nowrap}
.sbtn{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.content{padding:22px 26px 70px;min-width:0;max-width:1300px;width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input[type=search]{flex:1 1 260px;min-width:0;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:.93rem}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--mut);height:38px;padding:0 4px;white-space:nowrap}
.hint{color:var(--mut);font-size:.8rem;margin:10px 2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.st small{color:var(--mut);font-size:.76rem;display:block}.st b{font-size:1.2rem;font-weight:600;display:block;margin-top:2px}.st span{font-size:.78rem;color:var(--mut)}
.st .ok{color:var(--ok)}.st .no{color:var(--bad)}

.sect{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.sect>h2{margin:0}
.sh{width:100%;display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--sec);color:#fff;text-align:left;font-size:1rem;font-weight:600}
.sh .t{flex:1;min-width:0;overflow-wrap:anywhere}.sh .n{font-size:.76rem;font-weight:500;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px}
.sh .ch{transition:transform .2s;font-size:.8rem}.sect.closed .ch{transform:rotate(-90deg)}.sect.closed .sb{display:none}
.chip{font-size:.72rem;font-weight:500;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:6px}
.note{margin:12px 16px 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);font-size:.88rem;display:flex;gap:10px;overflow-wrap:anywhere}.note i{font-style:normal}
.tw{overflow-x:auto;padding:12px 16px 16px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
th{background:var(--hd);color:var(--mut);text-align:left;font-weight:600;font-size:.8rem;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child{border-radius:10px 0 0 0}th:last-child{border-radius:0 10px 0 0}
td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td.no,th.no{width:48px;text-align:center;color:var(--mut)}
td.cp{cursor:copy}td.cp:hover{background:var(--hd)}td.cp.ok{background:color-mix(in srgb,var(--pri) 18%,transparent)}
td a{color:var(--pri);text-decoration:underline;text-underline-offset:2px}
.pwc{display:flex;align-items:center;gap:6px}.pwc .v{flex:1;min-width:90px}
.mini{flex:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--hd);font-size:.85rem}.mini:hover{border-color:var(--pri)}
.empty{padding:50px 16px;text-align:center;color:var(--mut)}
mark{background:#ffe066;color:#222;border-radius:3px;padding:0 1px}

dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,10,18,.55)}
.dh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.db{padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(100dvh - 140px)}
.df{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--mut)}
.fld input,.fld select{height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--hd);font-size:.95rem;color:var(--tx)}
.grp{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.grp h3{margin:0;font-size:.92rem}.grp p{margin:0;font-size:.84rem;color:var(--mut)}.rowb{display:flex;gap:8px;flex-wrap:wrap}
.bl a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.84rem;color:var(--tx);text-decoration:none}.bl a:hover{color:var(--pri)}.bl span{color:var(--mut);white-space:nowrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:#17202e;color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.s{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0 0 auto 0;height:3px;background:var(--pri);transform-origin:left;animation:bar 1s infinite;z-index:100}
@keyframes bar{0%{transform:scaleX(0)}100%{transform:scaleX(1);opacity:.2}}

@media(max-width:900px){
 #app{display:block}
 .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-right:0;border-bottom:1px solid var(--bd);overflow:visible}
 .brand{flex:1;min-width:0;align-items:center}.brand .logo{width:34px;height:34px}.brand small{display:none}.brand b{font-size:.98rem}
 .side .cap{display:none}.side nav{order:3;width:100%}
 #sheets{flex-direction:row;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
 .sh1{flex:none;border:1px solid var(--bd);background:var(--hd);border-radius:99px;padding:7px 14px;gap:6px}.sh1 em{display:none}
 .sbtn{margin:0;flex-direction:row}.sbtn .lbl{display:none}.sbtn .btn{width:38px;padding:0}
 .content{padding:14px 14px 70px}
}
@media(max-width:700px){
 .stats{grid-template-columns:1fr 1fr}.st b{font-size:1.05rem}
 .tw{padding:10px}.note{margin:10px 10px 0}.sh{padding:12px 14px}
 table,tbody{display:block}thead{display:none}
 tr{display:block;border:1px solid var(--bd);border-radius:12px;padding:4px 12px;margin-bottom:10px}
 td{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
 td:last-child{border-bottom:0}td::before{content:attr(data-l);color:var(--mut);font-size:.78rem}
 td[data-l=""]{grid-template-columns:1fr}td[data-l=""]::before{display:none}
 td.no{width:auto;text-align:left;font-size:.78rem}td.no::before{content:"No"}
 .bar .chk{flex:1 1 40%}
}
</style></head><body>

<section id="login">
 <button class="btn thm" onclick="toggleTheme()" title="Ganti tema" aria-label="Ganti tema">🌓</button>
 <div class="lbox">
  <div class="logo">🔒</div>
  <h1 class="bn">Data IT KSU</h1><p class="bs"></p>
  <p id="lsub">Memeriksa pengaturan PIN…</p>
  <div class="dots" id="dots"></div><div id="lmsg" role="alert"></div><div class="pad" id="pad"></div>
 </div>
</section>

<div id="app" class="hide">
 <aside class="side">
  <div class="brand"><div class="logo">🗂️</div>
   <div class="bt"><b class="bn">Data IT KSU</b><small class="bs"></small></div>
   <button class="ed" onclick="openName()" title="Ubah nama aplikasi" aria-label="Ubah nama aplikasi">✏️</button></div>
  <nav><p class="cap">SHEET</p><div id="sheets"></div></nav>
  <div class="sbtn">
   <button class="btn thm" onclick="toggleTheme()" title="Ganti tema terang/gelap">🌓<span class="lbl" id="thl">Tema</span></button>
   <button class="btn" onclick="openAdmin()" title="Kunci dan backup">⚙️<span class="lbl">Kunci dan backup</span></button>
   <button class="btn" onclick="logout()" title="Keluar">🚪<span class="lbl">Keluar</span></button>
  </div>
 </aside>
 <div class="content">
  <div class="bar">
   <input id="q" type="search" placeholder="Cari perangkat, IP, user… (tekan / )" oninput="onSearch()" autocomplete="off">
   <label class="chk"><input type="checkbox" id="all" onchange="onSearch()"> Semua sheet</label>
   <button class="btn" id="mk" onclick="toggleMask()">🙈 Sandi tersembunyi</button>
   <button class="btn" id="col" onclick="toggleAll()">⇕ Ciutkan</button>
   <button class="btn" onclick="load(cur,true)" title="Muat ulang">🔄</button>
  </div>
  <div class="stats" id="stats"></div>
  <p class="hint" id="hint">Ketuk sel untuk menyalin. Sandi disembunyikan; ketuk 👁 untuk menampilkan. Sesi keluar otomatis setelah 10 menit tidak dipakai.</p>
  <div id="out" style="margin-top:14px"></div>
 </div>
</div>

<dialog id="dName"><div class="dh">Ubah nama aplikasi<button class="mini" onclick="dName.close()" aria-label="Tutup">✕</button></div>
 <div class="db"><label class="fld">Nama aplikasi<input id="inName" maxlength="40"></label>
 <label class="fld">Keterangan di bawah nama<input id="inSub" maxlength="80"></label>
 <p class="hint" style="margin:0">Nama tampil juga di halaman login dan judul tab browser.</p></div>
 <div class="df"><button class="btn" onclick="dName.close()">Batal</button><button class="btn pri" id="svName" onclick="saveName()">Simpan nama</button></div></dialog>

<dialog id="dAdm"><div class="dh">Kunci dan backup<button class="mini" onclick="dAdm.close()" aria-label="Tutup">✕</button></div>
 <div class="db" id="admBody"></div></dialog>
<div id="toast"></div>

<script>
/* ★★★ TEMPEL DISINI ★★★ URL Web App (berakhiran /exec). Tidak perlu diisi jika dibuka dari link Apps Script. */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwaWjFrJnXfPmHFMX63ANn4qftQ2xv8-mn1wjsfOq4AKG-Cig8aNCN5ujX3Cb3PC7XW3w/exec';

const IN_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let PIN='',LEN=0,S=null,cur=null,cache={},mask=true,entry='',locked=false,idle=null,allMode=false,collapsed=new Set(),curStat={sec:0,ent:0},BR={name:'Data IT KSU',sub:'Data jaringan dan perangkat'};

function toast(m){const t=$('toast');t.textContent=m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}
function busy(on){let b=$('busy');if(on&&!b){b=document.createElement('div');b.id='busy';document.body.appendChild(b)}else if(!on&&b)b.remove()}

/* ---------- tema ---------- */
const effTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function themeUI(){const d=effTheme()==='dark';$('thl').textContent=d?'Tema terang':'Tema gelap';document.querySelectorAll('.thm').forEach(b=>b.firstChild.textContent=d?'☀️':'🌙')}
function toggleTheme(){const n=effTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;st.set('ksu_theme',n);themeUI()}

/* ---------- nama aplikasi ---------- */
function brand(b){if(b&&b.name)BR={name:b.name,sub:b.sub||''};
 document.querySelectorAll('.bn').forEach(e=>e.textContent=BR.name);
 document.querySelectorAll('.bs').forEach(e=>{e.textContent=BR.sub;e.style.display=BR.sub?'':'none'});
 document.title=BR.name;st.set('ksu_brand',JSON.stringify(BR))}
function openName(){$('inName').value=BR.name;$('inSub').value=BR.sub;dName.showModal()}
async function saveName(){const n=$('inName').value.trim();if(!n)return toast('Nama tidak boleh kosong');
 $('svName').disabled=true;
 try{brand(await call('settings',{name:n,sub:$('inSub').value.trim()}));dName.close();toast('✅ Nama disimpan')}
 catch(e){toast('❌ '+e.message)}$('svName').disabled=false}

/* ---------- server ---------- */
async function call(action,p={}){
 busy(true);
 try{
  if(IN_GAS){
   const G={pinlen:()=>['api_pinlen'],check:()=>['api_check',PIN],init:()=>['api_init',PIN],data:p=>['api_data',p.name,PIN],
    lock:p=>['api_lock',p.name,p.on==='1',PIN],lockAll:p=>['api_lockAll',p.on==='1',PIN],backup:()=>['api_backup',PIN],
    auto:p=>['api_auto',p.mode,Number(p.jam),PIN],backups:()=>['api_backups',PIN],settings:p=>['api_setSettings',p.name,p.sub,PIN]}[action](p);
   return await new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||e)))[G[0]](...G.slice(1)));
  }
  if(!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL))throw new Error('URL Web App belum diisi (SCRIPT_URL)');
  const q=new URLSearchParams({action,...p});if(action!=='pinlen')q.set('key',PIN);
  const j=await(await fetch(SCRIPT_URL+'?'+q)).json();
  if(!j.ok)throw new Error(j.error);return j.data;
 }finally{busy(false)}}

/* ---------- login ---------- */
function drawDots(){$('dots').innerHTML=Array.from({length:LEN},(_,i)=>`<div class="dot ${i<entry.length?'fill':''} ${i===entry.length?'cur':''}"></div>`).join('')}
function drawPad(){$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(x=>`<button data-k="${x}" class="${/\d/.test(x)?'':'fn'}" aria-label="${x==='C'?'Hapus semua':x==='⌫'?'Hapus satu':x}">${x}</button>`).join('')}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)});
const onLogin=()=>!$('login').classList.contains('hide');
document.addEventListener('keydown',e=>{
 if(onLogin()){if(!LEN)return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Escape')key('C');return}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();$('q').focus()}});
document.addEventListener('paste',e=>{if(!onLogin()||!LEN)return;((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').split('').forEach(key)});
function lmsg(m,info){const e=$('lmsg');e.textContent=m||'';e.className=info?'info':''}
function key(k){if(locked||!LEN)return;
 if(k==='C')entry='';else if(k==='⌫')entry=entry.slice(0,-1);else if(/^\d$/.test(k)&&entry.length<LEN)entry+=k;
 lmsg('');drawDots();if(entry.length===LEN)submit()}
async function submit(){
 locked=true;PIN=entry;$('pad').querySelectorAll('button').forEach(b=>b.disabled=true);
 try{await call('check');try{sessionStorage.setItem('ksu_pin',PIN)}catch(e){}await enter()}
 catch(err){PIN='';entry='';lmsg(err.message);const d=$('dots');d.classList.add('err');setTimeout(()=>{d.classList.remove('err');drawDots()},450)}
 locked=false;$('pad').querySelectorAll('button').forEach(b=>b.disabled=false)}
async function boot(){
 themeUI();try{const b=JSON.parse(st.get('ksu_brand')||'null');if(b)brand(b)}catch(e){}
 try{const r=await call('pinlen');brand(r);LEN=Number(r.len)||0;
  if(!LEN){$('lsub').textContent='PIN belum diatur di spreadsheet.';lmsg('Buka spreadsheet, lalu klik tombol Atur PIN.');return}
  $('lsub').textContent='Masukkan PIN '+LEN+' angka';drawDots();drawPad();
  let sv='';try{sv=sessionStorage.getItem('ksu_pin')||''}catch(e){}
  if(sv.length===LEN){entry=sv;drawDots();submit()}
 }catch(err){$('lsub').textContent='Tidak dapat terhubung';lmsg(err.message)}}

/* ---------- aplikasi ---------- */
async function enter(){
 S=await call('init');brand(S.app);
 $('login').classList.add('hide');$('app').classList.remove('hide');themeUI();
 await load(S.sheets[0].name);resetIdle()}
function logout(){
 try{sessionStorage.removeItem('ksu_pin')}catch(e){}
 PIN='';entry='';cache={};S=null;clearTimeout(idle);document.querySelectorAll('dialog[open]').forEach(d=>d.close());
 $('app').classList.add('hide');$('out').innerHTML='';$('q').value='';$('login').classList.remove('hide');lmsg('');drawDots()}
function resetIdle(){clearTimeout(idle);idle=setTimeout(()=>{logout();lmsg('Sesi berakhir karena tidak dipakai',true)},10*60*1000)}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(S)resetIdle()},{passive:true}));

function sheetsUI(){$('sheets').innerHTML=S.sheets.map((x,i)=>`<button class="sh1 ${x.name===cur?'on':''}" data-i="${i}"><span>${esc(x.name)}</span><em>${x.locked?'🔒 ':''}${x.rows} baris</em></button>`).join('')}
$('sheets').addEventListener('click',e=>{const b=e.target.closest('.sh1');if(b){$('q').value='';$('all').checked=false;allMode=false;load(S.sheets[+b.dataset.i].name)}});
async function load(n,force){
 cur=n;sheetsUI();$('out').innerHTML='<div class="empty">Memuat…</div>';
 try{if(force||!cache[n])cache[n]=(await call('data',{name:n})).values;const p=parse(cache[n]);curStat={sec:p.length,ent:p.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.tbl?i.tbl.rows.length:0),0),0)};render()}
 catch(err){$('out').innerHTML='<div class="empty">'+esc(err.message)+'</div>'}}
async function onSearch(){
 allMode=$('all').checked;const q=$('q').value.trim();
 if(allMode&&q){const miss=S.sheets.filter(x=>!cache[x.name]);
  if(miss.length)try{await Promise.all(miss.map(async x=>cache[x.name]=(await call('data',{name:x.name})).values))}catch(e){toast('❌ '+e.message)}}
 render()}

/* baris mentah -> bagian, catatan, tabel */
function parse(rows){
 const blocks=[];let sec=null,tbl=null;
 const ns=t=>{sec={title:t,items:[]};blocks.push(sec);tbl=null};
 rows.forEach(r=>{const c=r.map(x=>String(x??'').trim()),f=c.filter(Boolean);if(!f.length)return;if(!sec)ns('');
  if(f.length===1){if(/^note\b/i.test(f[0])){sec.items.push({note:f[0].replace(/^note\s*:?\s*/i,'')});tbl=null}else ns(f[0]);return}
  if(/^(no|nomor)\.?$/i.test(c[0])){tbl={head:c,rows:[]};sec.items.push({tbl});return}
  if(!tbl){tbl={head:null,rows:[]};sec.items.push({tbl})}tbl.rows.push(c)});
 return blocks}
const isPW=h=>/pass|sandi|pin/i.test(h||''),isNo=h=>/^(no|nomor)/i.test(h||'');
function hl(t,q){const e=esc(t);if(!q)return e;const i=t.toLowerCase().indexOf(q);return i<0?e:esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function cellHTML(v,h,q){
 if(/^https?:\/\/\S+$/i.test(v))return`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${hl(v,q)}</a>`;return hl(v,q)}

function secHTML(sn,sec,q,showSheet){
 let body='',rowsN=0;const key=sn+'::'+sec.title,secHit=q&&sec.title.toLowerCase().includes(q);
 sec.items.forEach(it=>{
  if(it.note!==undefined){if(!q||secHit||it.note.toLowerCase().includes(q))body+=`<div class="note"><i>ℹ️</i><span>${hl(it.note,q)}</span></div>`;return}
  const {head,rows}=it.tbl,w=Math.max(head?head.length:0,...rows.map(r=>r.length)),keep=[];
  for(let c=0;c<w;c++)if((head&&head[c])||rows.some(r=>r[c]))keep.push(c);
  const rs=rows.filter(r=>!q||secHit||r.join(' ').toLowerCase().includes(q));if(!rs.length)return;rowsN+=rs.length;
  const uc=head?head.findIndex(h=>/user|pengguna|akun/i.test(h)):-1;
  let t='<div class="tw"><table>';
  if(head)t+='<thead><tr>'+keep.map(c=>`<th class="${c===0&&isNo(head[0])?'no':''}">${esc(head[c]||'')}</th>`).join('')+'</tr></thead>';
  t+='<tbody>'+rs.map(r=>'<tr>'+keep.map(c=>{
    const v=r[c]||'',h=head&&head[c]||'',L=`data-l="${esc(h)}"`;
    if(c===0&&head&&isNo(head[0]))return`<td class="no" ${L}>${esc(v)}</td>`;
    if(isPW(h)&&v)return`<td ${L}><div class="pwc"><span class="v mono" data-v="${esc(v)}" data-m="${mask?1:0}">${mask?'••••••••':esc(v)}</span><button class="mini" data-a="eye" title="Tampilkan/sembunyikan">${mask?'👁':'🙈'}</button><button class="mini" data-a="copy" title="Salin sandi">📋</button>${uc>=0&&r[uc]?`<button class="mini" data-a="both" data-u="${esc(r[uc])}" title="Salin user dan sandi">👤</button>`:''}</div></td>`;
    const mono=/ip|alamat|url|link|halaman/i.test(h)||/^(https?:|\d{1,3}(\.\d{1,3}){3})/.test(v);
    return`<td class="cp ${mono?'mono':''}" ${L} data-v="${esc(v)}">${cellHTML(v,h,q)}</td>`}).join('')+'</tr>').join('')+'</tbody></table></div>';
  body+=t});
 if(!body)return{html:'',n:0};
 return{n:rowsN,html:`<section class="sect ${collapsed.has(key)?'closed':''}" data-k="${esc(key)}"><h2><button class="sh" aria-expanded="true"><span class="t">${showSheet?`<span class="chip">${esc(sn)}</span> `:''}${hl(sec.title||sn,q)}</span>${rowsN?`<span class="n">${rowsN} entri</span>`:''}<span class="ch">▼</span></button></h2><div class="sb">${body}</div></section>`}}

function statsHTML(){
 const s=S.sheets.find(x=>x.name===cur)||{},nL=S.sheets.filter(x=>x.locked).length,tot=S.sheets.reduce((a,x)=>a+x.rows,0);
 const au=S.auto?(S.auto.startsWith('harian')?'Otomatis harian ':'Otomatis mingguan (Senin) ')+String(S.auto.split('@')[1]).padStart(2,'0')+':00':'Backup otomatis mati';
 return`<div class="st"><small>Sheet ini</small><b>${esc(cur)}</b><span>${curStat.sec} bagian · ${curStat.ent} entri</span></div>
 <div class="st"><small>Status kunci</small><b class="${s.locked?'ok':'no'}">${s.locked?'🔒 Terkunci':'🔓 Terbuka'}</b><span>${nL} dari ${S.sheets.length} sheet terkunci</span></div>
 <div class="st"><small>Seluruh spreadsheet</small><b>${S.sheets.length} sheet</b><span>${tot} baris data</span></div>
 <div class="st"><small>Backup terakhir</small><b>${S.last?ago(S.last.at):'Belum ada'}</b><span>${au}</span></div>`}
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return'Baru saja';if(m<60)return m+' menit lalu';if(m<1440)return Math.round(m/60)+' jam lalu';return Math.round(m/1440)+' hari lalu'}

function render(){
 if(!S)return;const q=$('q').value.trim().toLowerCase(),multi=allMode&&q,names=multi?S.sheets.map(x=>x.name):[cur];
 $('stats').innerHTML=statsHTML();let html='',n=0,secs=0;
 names.forEach(sn=>{if(!cache[sn])return;parse(cache[sn]).forEach(sec=>{const r=secHTML(sn,sec,q,multi);if(r.html){html+=r.html;n+=r.n;secs++}})});
 if(!(cache[cur]||[]).length&&!multi)html='<div class="empty">Sheet ini kosong.</div>';
 $('out').innerHTML=html||'<div class="empty">Tidak ada hasil untuk “'+esc(q)+'”.</div>';
 $('hint').textContent=q?`${n} entri cocok di ${secs} bagian${multi?' (semua sheet)':''}.`:'Ketuk sel untuk menyalin. Sandi disembunyikan; ketuk 👁 untuk menampilkan. Sesi keluar otomatis setelah 10 menit tidak dipakai.';
 colLabel()}
function colLabel(){const s=[...document.querySelectorAll('#out .sect')];$('col').textContent=s.length&&s.every(x=>x.classList.contains('closed'))?'⇕ Buka semua':'⇕ Ciutkan'}
function toggleAll(){const s=[...document.querySelectorAll('#out .sect')],close=s.some(x=>!x.classList.contains('closed'));
 s.forEach(x=>{x.classList.toggle('closed',close);close?collapsed.add(x.dataset.k):collapsed.delete(x.dataset.k)});colLabel()}

$('out').addEventListener('click',e=>{
 const h=e.target.closest('.sh');if(h){const s=h.closest('.sect');s.classList.toggle('closed');s.classList.contains('closed')?collapsed.add(s.dataset.k):collapsed.delete(s.dataset.k);h.setAttribute('aria-expanded',!s.classList.contains('closed'));return colLabel()}
 const b=e.target.closest('.mini');
 if(b){const v=b.parentNode.querySelector('.v'),a=b.dataset.a;
  if(a==='copy')return copy(v.dataset.v);if(a==='both')return copy(b.dataset.u+'\n'+v.dataset.v,'User dan sandi disalin');
  const hide=v.dataset.m==='1';v.dataset.m=hide?0:1;v.textContent=hide?v.dataset.v:'••••••••';b.textContent=hide?'🙈':'👁';return}
 if(e.target.closest('a'))return;
 const td=e.target.closest('td.cp');if(td){copy(td.dataset.v);td.classList.add('ok');setTimeout(()=>td.classList.remove('ok'),500)}});
function copy(v,msg){const ok=()=>toast('📋 '+(msg||'Disalin'));
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(ok,()=>fb(v,ok));else fb(v,ok)}
function fb(v,ok){const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Gagal menyalin')}t.remove()}
function toggleMask(){mask=!mask;$('mk').textContent=mask?'🙈 Sandi tersembunyi':'👁 Sandi tampil';render()}

/* ---------- kunci dan backup ---------- */
function arm(b,fn,txt){if(b.dataset.arm){clearTimeout(b._t);delete b.dataset.arm;b.classList.remove('arm');b.textContent=b.dataset.o;return fn()}
 b.dataset.o=b.textContent;b.dataset.arm=1;b.classList.add('arm');b.textContent=txt||'Klik lagi untuk memastikan';
 b._t=setTimeout(()=>{delete b.dataset.arm;b.classList.remove('arm');b.textContent=b.dataset.o},3500)}
function admHTML(){
 const s=S.sheets.find(x=>x.name===cur)||{},[m,j]=(S.auto||'mati@2').split('@');
 return`<div class="grp"><h3>Kunci sheet</h3><p>Sheet “${esc(cur)}” saat ini ${s.locked?'🔒 terkunci':'🔓 terbuka'}. Sheet terkunci hanya bisa diubah pemilik.</p>
  <div class="rowb"><button class="btn ${s.locked?'':'bad'}" onclick="act(this,'lock',{name:cur,on:'${s.locked?0:1}'})">${s.locked?'🔓 Buka kunci sheet ini':'🔒 Kunci sheet ini'}</button></div>
  <div class="rowb"><button class="btn bad" onclick="arm(this,()=>act(null,'lockAll',{on:'1'}),'Klik lagi: kunci semua')">🔒 Kunci semua sheet</button><button class="btn" onclick="arm(this,()=>act(null,'lockAll',{on:'0'}),'Klik lagi: buka semua')">🔓 Buka semua sheet</button></div></div>
 <div class="grp"><h3>Backup</h3><p>${S.last?'Terakhir: '+esc(S.last.name):'Belum ada backup.'}</p>
  <div class="rowb"><button class="btn pri" onclick="act(this,'backup')">💾 Backup sekarang</button><a class="btn" href="${esc(S.folderUrl)}" target="_blank" rel="noopener">📂 Buka folder backup</a></div></div>
 <div class="grp"><h3>Backup otomatis</h3>
  <div class="rowb"><label class="fld" style="flex:1">Jadwal<select id="aM"><option value="mati" ${m==='mati'?'selected':''}>Mati</option><option value="harian" ${m==='harian'?'selected':''}>Setiap hari</option><option value="mingguan" ${m==='mingguan'?'selected':''}>Setiap Senin</option></select></label>
  <label class="fld" style="flex:1">Jam<select id="aJ">${Array.from({length:24},(_,i)=>`<option value="${i}" ${+j===i?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('')}</select></label></div>
  <div class="rowb"><button class="btn" onclick="act(this,'auto',{mode:$('aM').value,jam:$('aJ').value})">Simpan jadwal</button></div></div>
 <div class="grp"><h3>Backup terbaru</h3><div class="bl" id="bl"><p>Memuat…</p></div></div>`}
async function openAdmin(){$('admBody').innerHTML=admHTML();dAdm.showModal();loadBl()}
async function loadBl(){try{const l=await call('backups');$('bl').innerHTML=l.length?l.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener"><div>${esc(x.name.replace(/^Backup /,''))}</div><span>${ago(x.at)}</span></a>`).join(''):'<p>Belum ada backup.</p>'}catch(e){$('bl').innerHTML='<p>'+esc(e.message)+'</p>'}}
async function act(b,a,p){if(b)b.disabled=true;
 try{S=await call(a,p||{});sheetsUI();$('admBody').innerHTML=admHTML();render();loadBl();toast('✅ Berhasil')}
 catch(e){toast('❌ '+e.message);if(b)b.disabled=false}}

boot();
</script></body></html>
